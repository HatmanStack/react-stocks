AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DistilFinBERT Sentiment Analysis Service

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Architectures:
      - x86_64
    Environment:
      Variables:
        MODEL_NAME: ProsusAI/finbert
        MODEL_CACHE_DIR: /tmp/models
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Resources:
  # Lambda Function
  DistilFinBERTFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'distilfinbert-sentiment-${Environment}'
      Description: DistilFinBERT sentiment analysis for financial news
      PackageType: Image
      ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/distilfinbert:latest'
      EphemeralStorage:
        Size: 1024  # 1GB for model files
      Events:
        SentimentApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DistilFinBERTApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DistilFinBERTApi
            Path: /
            Method: ANY
      Tags:
        Service: distilfinbert
        Environment: !Ref Environment

  # HTTP API Gateway
  DistilFinBERTApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: !Sub 'DistilFinBERT API - ${Environment}'
      CorsConfiguration:
        AllowOrigins:
          - '*'  # TODO: Restrict to specific domains in production
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'
        MaxAge: 300
      Tags:
        Service: distilfinbert
        Environment: !Ref Environment

  # CloudWatch Log Group
  DistilFinBERTLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/distilfinbert-sentiment-${Environment}'
      RetentionInDays: 7  # 7 days retention to reduce costs

  # CloudWatch Alarms
  DistilFinBERTErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'distilfinbert-errors-${Environment}'
      AlarmDescription: Alert when error rate exceeds 5%
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DistilFinBERTFunction
      TreatMissingData: notBreaching

  DistilFinBERTDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'distilfinbert-duration-${Environment}'
      AlarmDescription: Alert when average duration exceeds 10 seconds
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300  # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10000  # 10 seconds in milliseconds
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DistilFinBERTFunction
      TreatMissingData: notBreaching

  DistilFinBERTThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'distilfinbert-throttles-${Environment}'
      AlarmDescription: Alert on any Lambda throttling
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DistilFinBERTFunction
      TreatMissingData: notBreaching

Outputs:
  DistilFinBERTApiUrl:
    Description: API Gateway endpoint URL for DistilFinBERT service
    Value: !Sub 'https://${DistilFinBERTApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'DistilFinBERTApiUrl-${Environment}'

  FunctionArn:
    Description: DistilFinBERT Lambda Function ARN
    Value: !GetAtt DistilFinBERTFunction.Arn
    Export:
      Name: !Sub 'DistilFinBERTFunctionArn-${Environment}'

  FunctionName:
    Description: DistilFinBERT Lambda Function Name
    Value: !Ref DistilFinBERTFunction

  ApiId:
    Description: HTTP API ID
    Value: !Ref DistilFinBERTApi
