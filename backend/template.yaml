AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: React Stocks Backend - Lambda API for Tiingo and Finnhub proxying

Parameters:
  TiingoApiKey:
    Type: String
    Description: Tiingo API key for stock price data

  FinnhubApiKey:
    Type: String
    Description: Finnhub API key for news data

  AllowedOrigins:
    Type: String
    Description: Comma-separated list of allowed CORS origins (e.g., https://example.com,https://www.example.com). Use '*' for development only.
    Default: '*'

  # --- Optimization Parameters ---

  EnableCompression:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: "Enable response compression (gzip) for API Gateway. HTTP API automatically compresses if client sends Accept-Encoding."

  # Lambda Configuration Parameters
  StocksMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Memory for stocks endpoint (I/O bound)

  StocksTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Timeout for stocks endpoint

  NewsMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Memory for news endpoint (I/O bound)

  NewsTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Timeout for news endpoint

  SearchMemory:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
    Description: Memory for search endpoint (Lightweight)

  SearchTimeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 900
    Description: Timeout for search endpoint

  SentimentMemory:
    Type: Number
    Default: 1536
    MinValue: 128
    MaxValue: 10240
    Description: Memory for sentiment endpoint (CPU intensive)

  SentimentTimeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Timeout for sentiment endpoint

  PredictMemory:
    Type: Number
    Default: 2048
    MinValue: 128
    MaxValue: 10240
    Description: Memory for predict endpoint (ML Training)

  PredictTimeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Timeout for predict endpoint

  EnableProvisionedConcurrency:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Enable provisioned concurrency for Lambda

  ProvisionedConcurrencyMarketHours:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 100
    Description: Number of provisioned instances during market hours

  ProvisionedConcurrencyPreMarket:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 100
    Description: Number of provisioned instances during pre-market

Conditions:
  EnableProvisioning: !Equals [!Ref EnableProvisionedConcurrency, 'true']

Globals:
  Function:
    # Set to max required for now since we use single function
    Timeout: !Ref PredictTimeout
    MemorySize: !Ref PredictMemory
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        LOG_LEVEL: INFO
    Tracing: Active  # Enable X-Ray tracing for debugging

Resources:
  # DynamoDB Tables for Shared Caching
  StocksCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-StocksCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: stocks

  TopTickersCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-TopTickersCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: listType
          AttributeType: S
      KeySchema:
        - AttributeName: listType
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: top-tickers

  NewsCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-NewsCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: articleHash
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: articleHash
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: news

  SentimentCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-SentimentCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: articleHash
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: articleHash
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: sentiment

  SentimentJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-SentimentJobs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: jobs

  # New Persistent Historical Tables for ML
  StockHistoricalData:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-StockHistoricalData'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: DataType
          Value: historical-prices

  ArticleAnalysisData:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ArticleAnalysisData'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: articleHash#date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: articleHash#date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: DataType
          Value: article-analysis

  DailySentimentAggregate:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-DailySentimentAggregate'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: DataType
          Value: daily-sentiment

  ReactStocksApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

      # API Gateway Throttling
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
        DataTraceEnabled: true
        DetailedMetricsEnabled: true

  CacheWarmingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/cacheWarming.handler
      Description: Pre-warms cache for popular tickers
      Timeout: 300
      MemorySize: 512
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TIINGO_API_KEY: !Ref TiingoApiKey
          FINNHUB_API_KEY: !Ref FinnhubApiKey
          STOCKS_CACHE_TABLE: !Ref StocksCacheTable
          NEWS_CACHE_TABLE: !Ref NewsCacheTable
          TOP_TICKERS_CACHE_TABLE: !Ref TopTickersCacheTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt StocksCacheTable.Arn
                - !GetAtt NewsCacheTable.Arn
                - !GetAtt TopTickersCacheTable.Arn
      Events:
        ScheduledWarming:
          Type: Schedule
          Properties:
            Schedule: cron(0 14 ? * MON-FRI *) # 9:00 AM ET (14:00 UTC)
            Description: Warm cache for top tickers 30 minutes before market open
            Enabled: true

  ReactStocksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/index.handler
      Description: Backend proxy for Tiingo and Finnhub APIs
      AutoPublishAlias: live
      # Provisioned Concurrency (Optional)
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: !If
          - EnableProvisioning
          - !Ref ProvisionedConcurrencyMarketHours
          - !Ref AWS::NoValue
      Environment:
        Variables:
          TIINGO_API_KEY: !Ref TiingoApiKey
          FINNHUB_API_KEY: !Ref FinnhubApiKey
          STOCKS_CACHE_TABLE: !Ref StocksCacheTable
          NEWS_CACHE_TABLE: !Ref NewsCacheTable
          SENTIMENT_CACHE_TABLE: !Ref SentimentCacheTable
          SENTIMENT_JOBS_TABLE: !Ref SentimentJobsTable
          STOCK_HISTORICAL_TABLE: !Ref StockHistoricalData
          ARTICLE_ANALYSIS_TABLE: !Ref ArticleAnalysisData
          DAILY_SENTIMENT_TABLE: !Ref DailySentimentAggregate
          PREDICTION_FUNCTION_NAME: !Ref ReactStocksFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt StocksCacheTable.Arn
                - !GetAtt NewsCacheTable.Arn
                - !GetAtt SentimentCacheTable.Arn
                - !GetAtt SentimentJobsTable.Arn
                - !GetAtt StockHistoricalData.Arn
                - !GetAtt ArticleAnalysisData.Arn
                - !GetAtt DailySentimentAggregate.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ReactStocksFunction.Arn
      Events:
        StocksApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /stocks
            Method: GET
        NewsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /news
            Method: GET
        SearchApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /search
            Method: GET
        SentimentPostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /sentiment
            Method: POST
        SentimentGetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /sentiment
            Method: GET
        SentimentJobApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /sentiment/job/{jobId}
            Method: GET
        PredictApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /predict
            Method: POST
        BatchStocksApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /batch/stocks
            Method: POST
        BatchNewsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /batch/news
            Method: POST
        BatchSentimentApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReactStocksApi
            Path: /batch/sentiment
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node20
        Sourcemap: false
        EntryPoints:
          - src/index.ts
        External:
          - aws-sdk
          - '@aws-sdk/client-dynamodb'
          - '@aws-sdk/lib-dynamodb'

  # Scheduled Scaling for Provisioned Concurrency
  ConcurrencyScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: EnableProvisioning
    Properties:
      MaxCapacity: !Ref ProvisionedConcurrencyMarketHours
      MinCapacity: 0
      ResourceId: !Sub function:${ReactStocksFunction}:live
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/lambda.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_LambdaTable
      ScalableDimension: lambda:function:ProvisionedConcurrentExecutions
      ServiceNamespace: lambda

  # SNS Topic for Cost Anomaly Notifications
  CostAnomalySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-CostAnomalyAlerts'
      DisplayName: 'React Stocks Cost Alerts'
      Tags:
        - Key: Project
          Value: react-stocks

  # CloudWatch Alarms
  LambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda invocations exceeded expected threshold"
      MetricName: Invocations
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Sum
      Period: 86400 # 1 day
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  DynamoDBReadUnitsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "DynamoDB read units exceeded expected threshold"
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref StocksCacheTable
      Statistic: Sum
      Period: 86400 # 1 day
      EvaluationPeriods: 1
      Threshold: 50000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic
      OKActions:
        - !Ref CostAnomalySNSTopic

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda average duration exceeded threshold - potential cold starts or performance issues"
      MetricName: Duration
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Average
      Period: 300 # 5 minutes
      EvaluationPeriods: 3
      Threshold: 5000 # 5 seconds average indicates issues
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda errors exceeded threshold"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda throttles detected - consider increasing concurrency"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReactStocksFunction
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

Outputs:
  ReactStocksApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ReactStocksApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ReactStocksFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ReactStocksFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  StocksCacheTableArn:
    Description: ARN of StocksCache DynamoDB table
    Value: !GetAtt StocksCacheTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StocksCacheTableArn'

  NewsCacheTableArn:
    Description: ARN of NewsCache DynamoDB table
    Value: !GetAtt NewsCacheTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-NewsCacheTableArn'

  CostAnomalySNSTopicArn:
    Description: SNS Topic ARN for cost anomaly alerts
    Value: !Ref CostAnomalySNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-CostAnomalySNSTopicArn'
