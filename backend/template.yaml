AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: React Stocks Backend - Lambda API for stock data (yfinance) and Finnhub news

Parameters:
  FinnhubApiKey:
    Type: String
    Description: Finnhub API key for news data

  AllowedOrigins:
    Type: String
    Description: Comma-separated list of allowed CORS origins (e.g., https://example.com,https://www.example.com). Use '*' for development only.
    Default: '*'

  DistilFinBERTApiUrl:
    Type: String
    Description: URL of the DistilFinBERT ML service API
    Default: ''

  # --- Optimization Parameters ---

  # Lambda Configuration Parameters
  StocksMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Memory for stocks endpoint (I/O bound)

  StocksTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Timeout for stocks endpoint

  NewsMemory:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Memory for news endpoint (I/O bound)

  NewsTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Timeout for news endpoint

  SearchMemory:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
    Description: Memory for search endpoint (Lightweight)

  SearchTimeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 900
    Description: Timeout for search endpoint

  SentimentMemory:
    Type: Number
    Default: 1536
    MinValue: 128
    MaxValue: 10240
    Description: Memory for sentiment endpoint (CPU intensive)

  SentimentTimeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Timeout for sentiment endpoint

  PredictMemory:
    Type: Number
    Default: 2048
    MinValue: 128
    MaxValue: 10240
    Description: Memory for predict endpoint (ML Training)

  PredictTimeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Timeout for predict endpoint

Globals:
  Function:
    # Set to max required for now since we use single function
    Timeout: !Ref PredictTimeout
    MemorySize: !Ref PredictMemory
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        LOG_LEVEL: INFO
    Tracing: Active  # Enable X-Ray tracing for debugging

Resources:
  # DynamoDB Tables for Shared Caching
  StocksCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-StocksCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: stocks

  NewsCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-NewsCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: articleHash
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: articleHash
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: news

  SentimentCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-SentimentCache'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: articleHash
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: articleHash
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: sentiment

  SentimentJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-SentimentJobs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: CacheType
          Value: jobs

  # New Persistent Historical Tables for ML
  StockHistoricalData:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-StockHistoricalData'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: DataType
          Value: historical-prices

  ArticleAnalysisData:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-ArticleAnalysisData'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: articleHash#date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: articleHash#date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: DataType
          Value: article-analysis

  DailySentimentAggregate:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-DailySentimentAggregate'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticker
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ticker
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: react-stocks
        - Key: DataType
          Value: daily-sentiment

  # API Gateway v2 HTTP API
  ReactStocksApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Split [',', !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300
      Tags:
        Project: react-stocks

  # API Gateway Stage
  ReactStocksApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ReactStocksApi
      StageName: $default
      AutoDeploy: true

  # Lambda Integration (Node.js - news, sentiment, predict)
  ReactStocksIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ReactStocksApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ReactStocksFunction.Arn
      PayloadFormatVersion: '2.0'

  # Lambda Integration (Python - stocks, search)
  PythonStocksIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ReactStocksApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PythonStocksFunction.Arn
      PayloadFormatVersion: '2.0'

  # Routes
  StocksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /stocks'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  NewsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /news'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /search'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  SentimentPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /sentiment'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SentimentGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SentimentJobRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment/job/{jobId}'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  SentimentArticlesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'GET /sentiment/articles'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  PredictRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /predict'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  BatchStocksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/stocks'
      Target: !Sub 'integrations/${PythonStocksIntegration}'

  BatchNewsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/news'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  BatchSentimentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ReactStocksApi
      RouteKey: 'POST /batch/sentiment'
      Target: !Sub 'integrations/${ReactStocksIntegration}'

  # Lambda Permission for API Gateway (Node.js)
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReactStocksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReactStocksApi}/*'

  # Lambda Permission for API Gateway (Python)
  PythonApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PythonStocksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReactStocksApi}/*'

  # Python Lambda Function for Stock Data (yfinance)
  PythonStocksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-python-stocks'
      CodeUri: python/
      Handler: index.handler
      Runtime: python3.13
      MemorySize: !Ref StocksMemory
      Timeout: !Ref StocksTimeout
      Description: Stock data API using yfinance (replaces Tiingo)
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          STOCKS_CACHE_TABLE: !Ref StocksCacheTable
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt StocksCacheTable.Arn
      Tracing: Active

  ReactStocksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ./
      Handler: dist/index.handler
      Description: Backend proxy for Finnhub news and ML services
      Environment:
        Variables:
          FINNHUB_API_KEY: !Ref FinnhubApiKey
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          STOCKS_CACHE_TABLE: !Ref StocksCacheTable
          NEWS_CACHE_TABLE: !Ref NewsCacheTable
          SENTIMENT_CACHE_TABLE: !Ref SentimentCacheTable
          SENTIMENT_JOBS_TABLE: !Ref SentimentJobsTable
          STOCK_HISTORICAL_TABLE: !Ref StockHistoricalData
          ARTICLE_ANALYSIS_TABLE: !Ref ArticleAnalysisData
          DAILY_SENTIMENT_TABLE: !Ref DailySentimentAggregate
          PREDICTION_FUNCTION_NAME: !Sub '${AWS::StackName}-api'
          DISTILFINBERT_API_URL: !Ref DistilFinBERTApiUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt StocksCacheTable.Arn
                - !GetAtt NewsCacheTable.Arn
                - !GetAtt SentimentCacheTable.Arn
                - !GetAtt SentimentJobsTable.Arn
                - !GetAtt StockHistoricalData.Arn
                - !GetAtt ArticleAnalysisData.Arn
                - !GetAtt DailySentimentAggregate.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api'

  # SNS Topic for Cost Anomaly Notifications
  CostAnomalySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-CostAnomalyAlerts'
      DisplayName: 'React Stocks Cost Alerts'
      Tags:
        - Key: Project
          Value: react-stocks

  # CloudWatch Alarms
  LambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda invocations exceeded expected threshold"
      MetricName: Invocations
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub '${AWS::StackName}-api'
      Statistic: Sum
      Period: 86400 # 1 day
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  DynamoDBReadUnitsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "DynamoDB read units exceeded expected threshold"
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref StocksCacheTable
      Statistic: Sum
      Period: 86400 # 1 day
      EvaluationPeriods: 1
      Threshold: 50000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic
      OKActions:
        - !Ref CostAnomalySNSTopic

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda average duration exceeded threshold - potential cold starts or performance issues"
      MetricName: Duration
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub '${AWS::StackName}-api'
      Statistic: Average
      Period: 300 # 5 minutes
      EvaluationPeriods: 3
      Threshold: 5000 # 5 seconds average indicates issues
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda errors exceeded threshold"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub '${AWS::StackName}-api'
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Lambda throttles detected - consider increasing concurrency"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub '${AWS::StackName}-api'
      Statistic: Sum
      Period: 300 # 5 minutes
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAnomalySNSTopic

Outputs:
  ReactStocksApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ReactStocksApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ReactStocksFunctionArn:
    Description: Lambda Function ARN (Node.js - news, sentiment, predict)
    Value: !GetAtt ReactStocksFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  PythonStocksFunctionArn:
    Description: Lambda Function ARN (Python - stocks, search)
    Value: !GetAtt PythonStocksFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PythonFunctionArn'

  StocksCacheTableArn:
    Description: ARN of StocksCache DynamoDB table
    Value: !GetAtt StocksCacheTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StocksCacheTableArn'

  NewsCacheTableArn:
    Description: ARN of NewsCache DynamoDB table
    Value: !GetAtt NewsCacheTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-NewsCacheTableArn'

  CostAnomalySNSTopicArn:
    Description: SNS Topic ARN for cost anomaly alerts
    Value: !Ref CostAnomalySNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-CostAnomalySNSTopicArn'
