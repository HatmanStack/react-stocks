name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx expo lint
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx jest --config jest.config.js --ci --forceExit
        working-directory: frontend

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Lint
        run: cd backend && npm run lint

  backend-tests:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      FINNHUB_API_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Type check
        run: cd backend && npx tsc --noEmit
      - name: Run tests
        run: cd backend && npm test -- --ci --forceExit

  python-stocks-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python stocks Lambda
        run: ruff check backend/python backend/python_tests

  python-stocks-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r backend/python/requirements.txt
          pip install -r backend/python/requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: backend/python
        run: pytest backend/python_tests --maxfail=1 -v

  ml-service-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python
        run: ruff check backend/services/ml backend/scripts

  ml-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r backend/services/ml/requirements.txt
          pip install pytest pytest-mock boto3 requests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/backend/ml --maxfail=1 -q

  status-check:
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-tests, backend-lint, backend-tests, python-stocks-lint, python-stocks-tests, ml-service-lint, ml-service-tests]
    if: always()
    steps:
      - name: All Checks Passed
        run: |
          if [[ "${{ needs.frontend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.python-stocks-lint.result }}" != "success" ]] || \
             [[ "${{ needs.python-stocks-tests.result }}" != "success" ]] || \
             [[ "${{ needs.ml-service-lint.result }}" != "success" ]] || \
             [[ "${{ needs.ml-service-tests.result }}" != "success" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed!"
